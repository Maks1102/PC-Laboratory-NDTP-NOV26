name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Download Godot 4.7.2
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64

      - name: Import project (headless)
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --import

      - name: Resources check (.tres)
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/check_resources.gd

      - name: State machine test
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . res://tests/test_state_machine.tscn

      - name: Interaction test (simulated mouse)
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . res://tests/test_interaction.tscn

      - name: UI flow test (E2E)
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . res://tests/test_ui_flow.tscn

      - name: Fan spin regression test
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . res://tests/check_fan_spin.tscn

      - name: gdUnit4 unit tests
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://addons/gdUnit4/bin/GdUnitCmdTool.gd -a res://tests/gdunit --ignoreHeadlessMode
